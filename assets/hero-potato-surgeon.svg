<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" role="img" aria-label="A potato surgeon using a spudger to operate on a TV, which flickers to life playing music">
  <defs>
    <radialGradient id="spot" cx="50%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#17324a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4b45e"/>
      <stop offset="55%" stop-color="#c9923e"/>
      <stop offset="100%" stop-color="#a9752c"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f18"/>
      <stop offset="100%" stop-color="#05100c"/>
    </linearGradient>
    <linearGradient id="spud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd977"/>
      <stop offset="100%" stop-color="#d89b2e"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="820" height="440" rx="18" fill="#0b0f14"/>
  <rect x="0" y="0" width="820" height="440" rx="18" fill="url(#spot)"/>

  <!-- operating table -->
  <rect x="78" y="332" width="664" height="20" rx="10" fill="#1c2a33"/>
  <rect x="150" y="352" width="16" height="42" rx="4" fill="#15202b"/>
  <rect x="654" y="352" width="16" height="42" rx="4" fill="#15202b"/>

  <!-- ===== TV patient ===== -->
  <g>
    <!-- stand -->
    <rect x="556" y="300" width="18" height="36" fill="#0d151c"/>
    <rect x="516" y="330" width="98" height="10" rx="5" fill="#0d151c"/>
    <!-- body -->
    <rect x="452" y="150" width="226" height="156" rx="14" fill="#15202b" stroke="#223240" stroke-width="2"/>
    <!-- screen -->
    <rect x="470" y="168" width="190" height="120" rx="8" fill="url(#scr)"/>
    <!-- startup flicker overlay -->
    <rect x="470" y="168" width="190" height="120" rx="8" fill="#0a1f18">
      <animate attributeName="opacity" values="1;1;0.2;1;0.1;0" keyTimes="0;0.45;0.55;0.62;0.72;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- equalizer bars (the payoff: music plays) -->
    <g>
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;0.75" dur="3.2s" repeatCount="indefinite"/>
      <rect x="500" y="200" width="16" height="60" rx="3" fill="#2ecf86">
        <animate attributeName="height" values="20;58;30;50;20" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="240;202;230;210;240" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="524" y="190" width="16" height="70" rx="3" fill="#35d28c">
        <animate attributeName="height" values="56;22;64;34;56" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="204;238;196;226;204" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="548" y="196" width="16" height="64" rx="3" fill="#2ecf86">
        <animate attributeName="height" values="34;60;24;54;34" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="226;200;236;206;226" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="572" y="192" width="16" height="68" rx="3" fill="#35d28c">
        <animate attributeName="height" values="60;28;52;22;60" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="200;232;208;238;200" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="596" y="198" width="16" height="62" rx="3" fill="#2ecf86">
        <animate attributeName="height" values="26;54;36;58;26" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="234;206;224;202;234" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="620" y="202" width="16" height="58" rx="3" fill="#35d28c">
        <animate attributeName="height" values="48;24;56;30;48" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="212;236;204;230;212" dur="0.9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- power LED -->
    <circle cx="565" cy="296" r="3" fill="#35d28c">
      <animate attributeName="opacity" values="0.2;0.2;1" keyTimes="0;0.55;0.75" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- pop sparkles at the seam -->
  <g fill="#ffe27a">
    <g transform="translate(452,214)">
      <path d="M0,-9 L2,-2 L9,0 L2,2 L0,9 L-2,2 L-9,0 L-2,-2 Z">
        <animateTransform attributeName="transform" type="scale" values="0;1.2;0" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(458,250)">
      <path d="M0,-7 L1.6,-1.6 L7,0 L1.6,1.6 L0,7 L-1.6,1.6 L-7,0 L-1.6,-1.6 Z">
        <animateTransform attributeName="transform" type="scale" values="0;1.1;0" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(446,236)">
      <path d="M0,-6 L1.4,-1.4 L6,0 L1.4,1.4 L0,6 L-1.4,1.4 L-6,0 L-1.4,-1.4 Z">
        <animateTransform attributeName="transform" type="scale" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- ===== Potato surgeon ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="2.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- shadow -->
    <ellipse cx="236" cy="330" rx="86" ry="14" fill="#000" opacity="0.25"/>

    <!-- steadying (left) arm onto the TV -->
    <path d="M300,250 Q380,236 452,250" stroke="url(#tater)" stroke-width="15" fill="none" stroke-linecap="round"/>
    <ellipse cx="452" cy="252" rx="13" ry="11" fill="#e4b45e"/>

    <!-- body -->
    <ellipse cx="236" cy="246" rx="74" ry="90" fill="url(#tater)"/>
    <!-- spots -->
    <ellipse cx="212" cy="214" rx="7" ry="5" fill="#8a5e20" opacity="0.55"/>
    <ellipse cx="262" cy="276" rx="9" ry="6" fill="#8a5e20" opacity="0.5"/>
    <ellipse cx="208" cy="286" rx="5" ry="4" fill="#8a5e20" opacity="0.5"/>
    <ellipse cx="270" cy="206" rx="5" ry="4" fill="#8a5e20" opacity="0.5"/>

    <!-- surgeon head mirror -->
    <path d="M196,178 Q236,160 276,178" stroke="#e8eef2" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="236" cy="172" r="15" fill="#cfe8ff" stroke="#e8eef2" stroke-width="4"/>
    <circle cx="236" cy="172" r="6" fill="#16303f"/>
    <circle cx="241" cy="167" r="2.4" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- focused brows -->
    <path d="M198,214 L222,220" stroke="#6e4a18" stroke-width="4" stroke-linecap="round"/>
    <path d="M274,214 L250,220" stroke="#6e4a18" stroke-width="4" stroke-linecap="round"/>
    <!-- eyes looking at the work -->
    <ellipse cx="214" cy="232" rx="11" ry="12" fill="#fff"/>
    <ellipse cx="258" cy="232" rx="11" ry="12" fill="#fff"/>
    <circle cx="219" cy="235" r="5" fill="#1a1205"/>
    <circle cx="263" cy="235" r="5" fill="#1a1205"/>
    <!-- surgical mask -->
    <path d="M202,250 Q236,246 270,250 Q268,284 236,288 Q204,284 202,250 Z" fill="#dff3ec" opacity="0.95"/>
    <path d="M204,260 Q236,257 268,260" stroke="#b9ddd0" stroke-width="2" fill="none"/>
    <path d="M205,270 Q236,268 267,270" stroke="#b9ddd0" stroke-width="2" fill="none"/>

    <!-- ===== working (right) arm + spudger (prying) ===== -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-11 286 236;7 286 236;-11 286 236" dur="1.15s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      <path d="M286,236 Q360,250 410,248" stroke="url(#tater)" stroke-width="15" fill="none" stroke-linecap="round"/>
      <ellipse cx="410" cy="248" rx="13" ry="11" fill="#e4b45e"/>
      <!-- spudger -->
      <g transform="translate(410,248) rotate(12)">
        <rect x="-4" y="-5" width="54" height="10" rx="5" fill="url(#spud)" stroke="#b9801f" stroke-width="1"/>
        <path d="M50,-5 L74,-1 L74,1 L50,5 Z" fill="url(#spud)" stroke="#b9801f" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- heartbeat vitals line -->
  <g transform="translate(0,406)">
    <line x1="80" y1="0" x2="740" y2="0" stroke="#1c2a33" stroke-width="2"/>
    <path d="M80,0 L250,0 L262,-18 L274,20 L286,0 L470,0 L482,-18 L494,20 L506,0 L740,0"
          fill="none" stroke="#35d28c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="660" stroke-dashoffset="660">
      <animate attributeName="stroke-dashoffset" values="660;0" dur="2.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- wordmark -->
  <text x="410" y="40" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="800" fill="#eaf6ef" letter-spacing="3">SPUDGER</text>
  <text x="410" y="62" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#7fae9c" letter-spacing="1.5">pry your own Samsung TV open — with Samsung's own tools</text>
</svg>
