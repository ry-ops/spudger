<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="Hand-drawn chase: a potato with arms and legs runs after a pack of panicked TVs across a rolling landscape">
  <defs>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="potato" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#f3ebc6"/>
      <stop offset="55%" stop-color="#e7d89c"/>
      <stop offset="100%" stop-color="#ccb76e"/>
    </linearGradient>
  </defs>

  <!-- paper -->
  <rect x="0" y="0" width="1000" height="360" fill="#f3ebd7"/>

  <g filter="url(#rough)" stroke="#2b2117" stroke-width="4.2" stroke-linejoin="round" stroke-linecap="round">

    <!-- ===== scrolling background ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
      <g id="bgtile">
        <!-- sky doodads -->
        <g fill="#f7f2e4" stroke-width="3.4">
          <path d="M120,70 q16,-20 34,-6 q22,-10 30,10 q18,2 6,18 l-78,0 q-10,-14 8,-22 z"/>
          <path d="M620,52 q16,-20 34,-6 q22,-10 30,10 q18,2 6,18 l-78,0 q-10,-14 8,-22 z"/>
        </g>
        <circle cx="880" cy="66" r="30" fill="#e7b24e" stroke-width="3.6"/>
        <!-- back hills -->
        <path d="M-20,250 q120,-70 260,-30 q150,34 300,-8 q180,-50 480,6 l0,160 l-1040,0 z" fill="#6ea069"/>
        <path d="M-20,278 q160,-44 340,-14 q190,28 360,-6 q150,-30 360,10 l0,120 l-1420,0 z" fill="#4f7d50"/>
        <!-- trees -->
        <g fill="#3f6a44" stroke-width="3.4">
          <path d="M70,250 l20,44 l-40,0 z"/><path d="M70,228 l24,40 l-48,0 z"/>
          <path d="M470,236 l20,44 l-40,0 z"/><path d="M470,214 l24,40 l-48,0 z"/>
          <path d="M770,250 l20,44 l-40,0 z"/>
        </g>
        <rect x="64" y="292" width="12" height="16" fill="#6b4423" stroke-width="3"/>
        <rect x="464" y="278" width="12" height="16" fill="#6b4423" stroke-width="3"/>
      </g>
      <use href="#bgtile" transform="translate(1000,0)"/>
    </g>

    <!-- ground band -->
    <path d="M-10,316 q120,-12 250,-2 q180,9 360,-3 q200,-12 410,2 l0,60 l-1020,0 z" fill="#5c8a52"/>
    <path d="M-10,316 q120,-12 250,-2 q180,9 360,-3 q200,-12 410,2" fill="none" stroke-width="4.4"/>

    <!-- scrolling grass tufts (foreground parallax) -->
    <g fill="none" stroke="#2f5a34" stroke-width="3.4">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="4s" repeatCount="indefinite"/>
      <g id="tufts">
        <path d="M40,316 l-4,-14 M46,316 l2,-16 M52,316 l8,-12"/>
        <path d="M300,320 l-4,-14 M306,320 l2,-16 M312,320 l8,-12"/>
        <path d="M700,316 l-4,-14 M706,316 l2,-16 M712,316 l8,-12"/>
      </g>
      <use href="#tufts" transform="translate(500,0)"/>
      <use href="#tufts" transform="translate(1000,0)"/>
    </g>

    <!-- motion streaks trailing the runners -->
    <g stroke="#2b2117" stroke-width="3.2" opacity="0.4" stroke-linecap="round">
      <g><animateTransform attributeName="transform" type="translate" values="16 0;-16 0;16 0" dur="0.42s" repeatCount="indefinite"/>
        <path d="M188,236 l-34,0 M198,266 l-46,0 M500,250 l-30,0 M688,262 l-38,0"/>
      </g>
    </g>

    <!-- ================= PACK OF FLEEING TVs ================= -->
    <!-- TV 3 (small, far ahead) -->
    <g transform="translate(905,252)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.26s" repeatCount="indefinite"/>
        <g stroke-width="3.6">
          <g><animateTransform attributeName="transform" type="rotate" values="20 -8 40;-20 -8 40;20 -8 40" dur="0.3s" repeatCount="indefinite"/><path d="M-8,40 l-4,22" fill="none"/><path d="M-16,64 l12,0" fill="none"/></g>
          <g><animateTransform attributeName="transform" type="rotate" values="-20 8 40;20 8 40;-20 8 40" dur="0.3s" repeatCount="indefinite"/><path d="M8,40 l4,22" fill="none"/><path d="M4,64 l12,0" fill="none"/></g>
        </g>
        <rect x="-28" y="-6" width="56" height="46" rx="8" fill="#d98b3c"/>
        <rect x="-20" y="2" width="40" height="30" rx="4" fill="#efe6cf"/>
        <circle cx="-8" cy="14" r="4" fill="#2b2117"/><circle cx="8" cy="14" r="4" fill="#2b2117"/>
        <path d="M-7,25 q7,7 14,0" fill="none" stroke-width="3"/>
        <path d="M-6,-6 l-10,-16 M6,-6 l10,-16" fill="none" stroke-width="3"/>
      </g>
    </g>

    <!-- TV 2 -->
    <g transform="translate(740,228)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="0.3s" repeatCount="indefinite"/>
        <!-- legs -->
        <g stroke-width="4">
          <g><animateTransform attributeName="transform" type="rotate" values="26 -14 46;-26 -14 46;26 -14 46" dur="0.32s" repeatCount="indefinite"/><path d="M-14,46 l-8,42" fill="none"/><path d="M-26,88 l18,0" fill="none"/></g>
          <g><animateTransform attributeName="transform" type="rotate" values="-26 14 46;26 14 46;-26 14 46" dur="0.32s" repeatCount="indefinite"/><path d="M14,46 l8,42" fill="none"/><path d="M8,88 l18,0" fill="none"/></g>
        </g>
        <!-- flailing arms -->
        <g><animateTransform attributeName="transform" type="rotate" values="-30 -34 6;10 -34 6;-30 -34 6" dur="0.3s" repeatCount="indefinite"/><path d="M-34,6 l-26,-16" fill="none" stroke-width="4"/><circle cx="-62" cy="-11" r="5" fill="#b9732e"/></g>
        <g><animateTransform attributeName="transform" type="rotate" values="20 34 6;-16 34 6;20 34 6" dur="0.3s" repeatCount="indefinite"/><path d="M34,6 l26,-20" fill="none" stroke-width="4"/><circle cx="62" cy="-15" r="5" fill="#b9732e"/></g>
        <!-- cabinet -->
        <rect x="-44" y="-30" width="88" height="80" rx="12" fill="#5fa0a0"/>
        <rect x="-34" y="-20" width="60" height="56" rx="6" fill="#eef0dc"/>
        <!-- knobs -->
        <circle cx="34" cy="-8" r="5" fill="#2b2117"/><circle cx="34" cy="10" r="5" fill="#2b2117"/>
        <!-- antenna -->
        <g><animateTransform attributeName="transform" type="rotate" values="-5 0 -30;5 0 -30;-5 0 -30" dur="0.5s" repeatCount="indefinite"/><path d="M-6,-30 l-20,-28 M6,-30 l22,-24" fill="none" stroke-width="3.4"/><circle cx="-26" cy="-58" r="3.5" fill="#2b2117"/><circle cx="28" cy="-54" r="3.5" fill="#2b2117"/></g>
        <!-- scared face (looking back-left) -->
        <ellipse cx="-16" cy="2" rx="9" ry="11" fill="#fff"/><ellipse cx="8" cy="2" rx="9" ry="11" fill="#fff"/>
        <circle cx="-20" cy="4" r="4.5" fill="#2b2117"><animate attributeName="cx" values="-20;-18;-20" dur="0.6s" repeatCount="indefinite"/></circle>
        <circle cx="4" cy="4" r="4.5" fill="#2b2117"><animate attributeName="cx" values="4;6;4" dur="0.6s" repeatCount="indefinite"/></circle>
        <ellipse cx="-4" cy="24" rx="9" ry="7" fill="#7a2f22" stroke-width="3"><animate attributeName="ry" values="7;3;7" dur="0.34s" repeatCount="indefinite"/></ellipse>
        <!-- sweat -->
        <path d="M22,-4 q6,8 0,14 q-6,-6 0,-14 z" fill="#8fd0e6" stroke-width="2.4"><animate attributeName="opacity" values="0;1;1;0" dur="1.2s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 10" dur="1.2s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <!-- TV 1 (nearest, biggest fright) -->
    <g transform="translate(560,216)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="0.32s" repeatCount="indefinite"/>
        <g stroke-width="4.2">
          <g><animateTransform attributeName="transform" type="rotate" values="30 -16 52;-30 -16 52;30 -16 52" dur="0.34s" repeatCount="indefinite"/><path d="M-16,52 l-10,48" fill="none"/><path d="M-34,100 l20,0" fill="none"/></g>
          <g><animateTransform attributeName="transform" type="rotate" values="-30 16 52;30 16 52;-30 16 52" dur="0.34s" repeatCount="indefinite"/><path d="M16,52 l10,48" fill="none"/><path d="M12,100 l20,0" fill="none"/></g>
        </g>
        <g><animateTransform attributeName="transform" type="rotate" values="-40 -40 8;6 -40 8;-40 -40 8" dur="0.32s" repeatCount="indefinite"/><path d="M-40,8 l-30,-22" fill="none" stroke-width="4.4"/><circle cx="-72" cy="-16" r="6" fill="#c98a2e"/></g>
        <g><animateTransform attributeName="transform" type="rotate" values="26 40 8;-14 40 8;26 40 8" dur="0.32s" repeatCount="indefinite"/><path d="M40,8 l30,-24" fill="none" stroke-width="4.4"/><circle cx="72" cy="-18" r="6" fill="#c98a2e"/></g>
        <rect x="-50" y="-34" width="100" height="92" rx="14" fill="#e0a43b"/>
        <rect x="-39" y="-23" width="68" height="64" rx="7" fill="#eef0dc"/>
        <circle cx="39" cy="-10" r="6" fill="#2b2117"/><circle cx="39" cy="12" r="6" fill="#2b2117"/>
        <g><animateTransform attributeName="transform" type="rotate" values="-6 0 -34;6 0 -34;-6 0 -34" dur="0.5s" repeatCount="indefinite"/><path d="M-7,-34 l-24,-32 M7,-34 l26,-28" fill="none" stroke-width="3.6"/><circle cx="-31" cy="-66" r="4" fill="#2b2117"/><circle cx="33" cy="-62" r="4" fill="#2b2117"/></g>
        <!-- terrified face -->
        <ellipse cx="-18" cy="2" rx="11" ry="14" fill="#fff"/><ellipse cx="10" cy="2" rx="11" ry="14" fill="#fff"/>
        <circle cx="-23" cy="5" r="5.5" fill="#2b2117"><animate attributeName="cx" values="-23;-20;-23" dur="0.5s" repeatCount="indefinite"/></circle>
        <circle cx="5" cy="5" r="5.5" fill="#2b2117"><animate attributeName="cx" values="5;8;5" dur="0.5s" repeatCount="indefinite"/></circle>
        <path d="M-14,-12 l-10,-5 M14,-12 l10,-6" fill="none" stroke-width="3"/>
        <ellipse cx="-4" cy="28" rx="12" ry="10" fill="#7a2f22" stroke-width="3.4"><animate attributeName="ry" values="10;4;10" dur="0.3s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="-4" cy="31" rx="5" ry="4" fill="#d8697a"/>
        <path d="M26,-6 q7,9 0,16 q-7,-7 0,-16 z" fill="#8fd0e6" stroke-width="2.6"><animate attributeName="opacity" values="0;1;1;0" dur="1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 0;0 12" dur="1s" repeatCount="indefinite"/></path>
      </g>
    </g>

    <!-- ================= CHASING POTATO ================= -->
    <g transform="translate(238,256)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="0.3s" repeatCount="indefinite"/>
        <!-- legs -->
        <g stroke-width="5.5">
          <g><animateTransform attributeName="transform" type="rotate" values="32 -12 26;-32 -12 26;32 -12 26" dur="0.3s" repeatCount="indefinite"/><path d="M-12,26 l-9,34" fill="none"/><path d="M-29,60 l22,0" fill="none"/></g>
          <g><animateTransform attributeName="transform" type="rotate" values="-32 14 26;32 14 26;-32 14 26" dur="0.3s" repeatCount="indefinite"/><path d="M14,26 l9,34" fill="none"/><path d="M9,60 l22,0" fill="none"/></g>
        </g>
        <!-- LEFT arm (swings back) -->
        <g><animateTransform attributeName="transform" type="rotate" values="-16 -44 -26;10 -44 -26;-16 -44 -26" dur="0.3s" repeatCount="indefinite"/>
          <path d="M-44,-26 q-30,0 -54,-10" fill="none" stroke-width="5.5"/>
          <g transform="translate(-98,-36)"><path d="M0,0 l-13,-6 M-2,5 l-14,-1 M-2,10 l-12,5" fill="none" stroke-width="3.8"/></g>
        </g>
        <!-- RIGHT arm (reaches for the TVs) -->
        <g><animateTransform attributeName="transform" type="rotate" values="12 44 -28;-10 44 -28;12 44 -28" dur="0.3s" repeatCount="indefinite"/>
          <path d="M44,-28 q34,-4 58,6" fill="none" stroke-width="5.5"/>
          <g transform="translate(102,-22)"><path d="M0,0 l13,-6 M2,5 l14,-1 M2,10 l12,5" fill="none" stroke-width="3.8"/></g>
        </g>
        <!-- yellow potato body (smooth oblong) -->
        <path d="M-50,-30 C-53,-70 -26,-88 2,-88 C30,-88 53,-68 52,-30 C54,4 34,34 0,34 C-36,34 -52,2 -50,-30 Z" fill="url(#potato)"/>
        <!-- small speckles only (no oval spots) -->
        <g fill="#a0874a" stroke="none">
          <circle cx="-30" cy="-32" r="2.4"/><circle cx="-12" cy="-6" r="2"/>
          <circle cx="-4" cy="22" r="2.2"/><circle cx="-36" cy="4" r="2"/>
          <circle cx="-22" cy="-48" r="1.8"/><circle cx="-18" cy="10" r="2"/>
        </g>
        <!-- determined hungry brows -->
        <path d="M-6,-58 l28,10 M40,-54 l26,-10" fill="none" stroke-width="4.4"/>
        <!-- eyes locked on the TVs -->
        <ellipse cx="14" cy="-38" rx="13" ry="15" fill="#fff"/><ellipse cx="46" cy="-38" rx="13" ry="15" fill="#fff"/>
        <circle cx="21" cy="-36" r="6.5" fill="#2b2117"><animate attributeName="r" values="6.5;6.5;1.5;6.5" keyTimes="0;0.9;0.95;1" dur="3.6s" repeatCount="indefinite"/></circle>
        <circle cx="53" cy="-36" r="6.5" fill="#2b2117"/>
        <!-- open grin scaled to the body (chomps) + tongue -->
        <path d="M-6,-4 q34,34 62,2 q-30,13 -62,-4 z" fill="#7a2f22" stroke-width="4.2"><animate attributeName="d" values="M-6,-4 q34,34 62,2 q-30,13 -62,-4 z;M-2,0 q30,22 54,0 q-28,9 -54,0 z;M-6,-4 q34,34 62,2 q-30,13 -62,-4 z" dur="0.5s" repeatCount="indefinite"/></path>
        <path d="M8,9 q17,15 34,2 q-17,8 -34,-2 z" fill="#d8697a" stroke-width="2.6"/>
      </g>
    </g>

  </g>
</svg>
