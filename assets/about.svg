<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="What Spudger is about: your app, unlocked with Samsung's own tools, onto a TV that becomes yours">
  <defs>
    <linearGradient id="acard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a22"/>
      <stop offset="100%" stop-color="#0d141b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="820" height="300" rx="18" fill="#0b0f14"/>

  <text x="410" y="40" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="17" font-weight="800" fill="#eaf6ef" letter-spacing="1">Make the TV you own, yours.</text>

  <g font-family="-apple-system,Segoe UI,Roboto,sans-serif">
    <!-- Stage A: your app -->
    <g transform="translate(70,88)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#acard)" stroke="#223240" stroke-width="1.5"/>
      <rect x="62" y="28" width="56" height="56" rx="12" fill="#0a1f18" stroke="#2ecf86" stroke-width="2"/>
      <path d="M82,46 L82,66 L100,56 Z" fill="#35d28c">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <text x="90" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#eaf6ef">Your app</text>
      <text x="90" y="126" text-anchor="middle" font-size="10.5" fill="#8aa39b">yours or open-source</text>
    </g>

    <!-- arrow A->B -->
    <g>
      <line x1="256" y1="158" x2="306" y2="158" stroke="#223240" stroke-width="3" stroke-linecap="round"/>
      <path d="M304,152 L316,158 L304,164 Z" fill="#35d28c"/>
      <circle cx="256" cy="158" r="4" fill="#35d28c">
        <animate attributeName="cx" values="256;304" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Stage B: Samsung's own keys (padlock unlocking) -->
    <g transform="translate(322,88)">
      <rect x="0" y="0" width="176" height="140" rx="12" fill="url(#acard)" stroke="#223240" stroke-width="1.5"/>
      <g transform="translate(88,56)">
        <!-- shackle (lifts to unlock) -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 -10;0 0" keyTimes="0;0.3;0.75;1" dur="3s" repeatCount="indefinite"/>
          <path d="M-14,2 L-14,-10 A14,14 0 0 1 14,-10 L14,2" fill="none" stroke="#f2c14e" stroke-width="6" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="0 14 2;0 14 2;18 14 2;18 14 2;0 14 2" keyTimes="0;0.28;0.42;0.72;1" dur="3s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- body -->
        <rect x="-20" y="2" width="40" height="34" rx="6" fill="#f2c14e"/>
        <circle cx="0" cy="16" r="5" fill="#0b0f14"/>
        <rect x="-2.5" y="16" width="5" height="12" rx="2.5" fill="#0b0f14"/>
      </g>
      <text x="88" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#eaf6ef">Samsung's own keys</text>
      <text x="88" y="126" text-anchor="middle" font-size="10.5" fill="#8aa39b">Dev Mode · sdb · DUID cert</text>
    </g>

    <!-- arrow B->C -->
    <g>
      <line x1="504" y1="158" x2="554" y2="158" stroke="#223240" stroke-width="3" stroke-linecap="round"/>
      <path d="M552,152 L564,158 L552,164 Z" fill="#35d28c"/>
      <circle cx="504" cy="158" r="4" fill="#35d28c">
        <animate attributeName="cx" values="504;552" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0" dur="1.4s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Stage C: your TV, yours -->
    <g transform="translate(570,88)">
      <rect x="0" y="0" width="180" height="140" rx="12" fill="url(#acard)" stroke="#223240" stroke-width="1.5"/>
      <rect x="54" y="26" width="72" height="50" rx="6" fill="#15202b" stroke="#2a3a47" stroke-width="2"/>
      <rect x="61" y="33" width="58" height="36" rx="3" fill="#06110d"/>
      <!-- screen glows on -->
      <rect x="61" y="33" width="58" height="36" rx="3" fill="#0a1f18">
        <animate attributeName="fill" values="#0a1f18;#123a2b;#0a1f18" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <!-- check mark drawing -->
      <path d="M74,51 L86,62 L108,40" fill="none" stroke="#35d28c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
        <animate attributeName="stroke-dashoffset" values="60;60;0;0;60" keyTimes="0;0.2;0.5;0.85;1" dur="2.6s" repeatCount="indefinite"/>
      </path>
      <rect x="82" y="76" width="16" height="7" fill="#0d151c"/>
      <rect x="66" y="83" width="48" height="6" rx="3" fill="#0d151c"/>
      <text x="90" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#eaf6ef">Your TV, yours</text>
      <text x="90" y="126" text-anchor="middle" font-size="10.5" fill="#8aa39b">boots into what you want</text>
    </g>
  </g>

  <text x="410" y="282" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#6e8a80">Sanctioned tools only — no piracy, no DRM circumvention. See ADR-0001.</text>
</svg>
